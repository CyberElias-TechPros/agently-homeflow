name = "agently-homeflow-api"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://agently-homeflow.vercel.app"
# JWT_SECRET is a Cloudflare secret (wrangler secret put JWT_SECRET) — never commit it here.

[[d1_databases]]
binding = "DB"
database_name = "agently-homeflow-db"
database_id = "d87c72ce-fd21-41b5-ac58-7bbad23307b7"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "agently-homeflow-storage"

[[kv_namespaces]]
binding = "CACHE"
id = "c0802226aa1c48ce918aea1ce69896b4"

[dev]
port = 8787

[observability]
enabled = true
