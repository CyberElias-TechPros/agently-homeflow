name: tmp-cleanup-qa
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA test user + orphan unit
        run: |
          U="7898c332-cc04-470d-878a-d03725d07c1c"
          npx -y wrangler@latest d1 execute agently-homeflow-db --remote --command "DELETE FROM units WHERE id LIKE '66431c26%';"
          npx -y wrangler@latest d1 execute agently-homeflow-db --remote --command "DELETE FROM users WHERE id='$U';"
          npx -y wrangler@latest d1 execute agently-homeflow-db --remote --command "SELECT count(*) AS remaining FROM users WHERE id='$U';"
