name: Deploy backend

# Deploys worker/agently-homeflow-api on push to main.
# No migrations step: schema lives in worker/schema.sql (single file, no
# migrations dir, no d1_migrations tracking). Schema changes are applied
# manually and carefully. Requires repo secrets CF_API_TOKEN +
# CF_ACCOUNT_ID (Cyber account).

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Cyber account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://agently-homeflow-api.cyber-e54.workers.dev/api/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"healthy"' || { echo "::error::agently-homeflow-api health check failed"; exit 1; }
